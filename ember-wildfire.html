};
for (const k in off) { off[k].width = N; off[k].height = N; }
const octx = { terrain: off.terrain.getContext('2d'), fire: off.fire.getContext('2d'), iso: off.iso.getContext('2d') };

const view = { zoom: 1, panX: 0, panY: 0, scale: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
const layers = {
  hillshade: true, fuel: true, fire: true, iso: false, smoke: true,
  roads: true, routes: true, zones: true, labels: true
};
let simT = 0;                 // current time, minutes since ignition
let selectedComm = -1;
let hoverCell = -1;

function fitView() {
  const wrap = document.getElementById('mapwrap');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  view.dpr = dpr; view.w = w; view.h = h;
  const base = Math.min(w, h) / N;
  view.scale = base * view.zoom;
  view.ox = (w - N * view.scale) / 2 + view.panX;
  view.oy = (h - N * view.scale) / 2 + view.panY;
}
const sx = x => x * view.scale + view.ox;
const sy = y => y * view.scale + view.oy;
const inv = (px, py) => ({ x: (px - view.ox) / view.scale, y: (py - view.oy) / view.scale });

/* ---------------------------------------------------------- terrain layer */
function paintTerrain() {
  const img = octx.terrain.createImageData(N, N);
  const d = img.data;
  for (let i = 0; i < N * N; i++) {
    const f = FUELS[land.fuel[i]];
    let r = f.col[0], g = f.col[1], b = f.col[2];
    if (!layers.fuel) {
      const e = (land.elev[i] - land.minE) / (land.maxE - land.minE);
      r = 60 + e * 130; g = 62 + e * 120; b = 58 + e * 100;
    }
    if (layers.hillshade && land.fuel[i] !== F_WATER) {
      const s = 0.55 + land.shade[i] * 0.85;
      r *= s; g *= s; b *= s;
      // subtle elevation tint keeps the high country readable
      const e = (land.elev[i] - land.minE) / (land.maxE - land.minE);
      r += e * 26; g += e * 24; b += e * 30;
    }
    const o = i * 4;
    d[o] = clamp(r, 0, 255); d[o + 1] = clamp(g, 0, 255); d[o + 2] = clamp(b, 0, 255); d[o + 3] = 255;
  }
  octx.terrain.putImageData(img, 0, 0);
}

/* --------------------------------------------------------- isochrone layer */
const ISO_STEP = 120;   // minutes between arrival-time contours
function paintIso() {
  const img = octx.iso.createImageData(N, N);
  const d = img.data;
  const step = ISO_STEP;
  for (let y = 1; y < N; y++) for (let x = 1; x < N; x++) {
    const i = idx(x, y), a = fire.arrival[i];
    if (a === INF) continue;
    const bi = Math.floor(a / step);
    const l = fire.arrival[idx(x - 1, y)], u = fire.arrival[idx(x, y - 1)];
    // only where two *reached* cells straddle a band boundary — otherwise every
    // unburned island gets outlined and the layer turns to noise
    const edge = (l !== INF && Math.floor(l / step) < bi) || (u !== INF && Math.floor(u / step) < bi);
    if (!edge) continue;
    const o = i * 4;
    const major = bi % 3 === 0;
    d[o] = 255; d[o + 1] = major ? 246 : 208; d[o + 2] = major ? 226 : 156;
    d[o + 3] = major ? 190 : 105;
  }
  octx.iso.putImageData(img, 0, 0);
}

/* -------------------------------------------------------------- fire layer */
const fireImg = { data: null };
function paintFire(t) {
  if (!fireImg.data) fireImg.data = octx.fire.createImageData(N, N);
  const img = fireImg.data, d = img.data;
  for (let i = 0; i < N * N; i++) {
    const a = fire.arrival[i];
    const o = i * 4;
    if (a === INF || a > t) { d[o + 3] = 0; continue; }
    const dt = t - a;
    let r, g, b, al;
    if (dt < 5) {            // flaming front
      const k = dt / 5;
      r = 255; g = 232 - k * 90; b = 150 - k * 130; al = 255;
    } else if (dt < 22) {    // ember / residual heat
      const k = (dt - 5) / 17;
      r = 255 - k * 80; g = 142 - k * 80; b = 20 + k * 6; al = 250;
    } else if (dt < 75) {    // cooling
      const k = (dt - 22) / 53;
      r = 175 - k * 118; g = 62 - k * 24; b = 26 - k * 2; al = 240 - k * 55;
    } else {                 // scar — semi-opaque so hillshade still reads
      r = 57; g = 38; b = 34; al = 185;
    }
    d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = al;
  }
  octx.fire.putImageData(img, 0, 0);
}

/* ------------------------------------------------------------------ smoke */
function drawSmoke(t) {
  // centroid of the active front, plume drawn downwind
  let cx = 0, cy = 0, n = 0;
  for (let i = 0; i < N * N; i += 3) {
    const a = fire.arrival[i];
    if (a === INF || a > t || t - a > 25) continue;
    cx += i % N; cy += (i / N) | 0; n++;
  }
  if (n < 6) return;
  cx /= n; cy /= n;
  const wRad = (scenario.windFrom + 180) * D2R;
  const ux = Math.sin(wRad), uy = -Math.cos(wRad);
  const spread = clamp(Math.sqrt(n) * 1.4, 10, 90);
  const reach = spread * 2.6 + scenario.windSpeed * 4;
  const x0 = sx(cx), y0 = sy(cy);
  const x1 = sx(cx + ux * reach), y1 = sy(cy + uy * reach);
  const L = Math.hypot(x1 - x0, y1 - y0);
  const W = Math.max(8, spread * view.scale * 0.9);

  ctx.save();
  ctx.translate(x0, y0);
  ctx.rotate(Math.atan2(y1 - y0, x1 - x0));
  const PUFFS = 16;
  for (let k = 0; k < PUFFS; k++) {
    const f = k / (PUFFS - 1);
    const px = f * L;
    const pr = W * (0.5 + f * 1.5);
    const alpha = 0.16 * (1 - f) * (1 - f) + 0.02;
    const g = ctx.createRadialGradient(px, 0, 0, px, 0, pr);
    g.addColorStop(0, `rgba(172,163,152,${alpha.toFixed(3)})`);
    g.addColorStop(1, 'rgba(160,152,144,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(px, 0, pr, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ roads */
function roadState(e, t) {
  if (e.fireT <= t) return 'closed';
  if (e.fireT - t < 30) return 'threat';
  if (e.vol > e.cap * 0.9) return 'jam';
  if (e.vol > e.cap * 0.6) return 'busy';
  return 'open';
}
/* Colour alone can't carry five states legibly on a busy map, so the two
   fire-driven states also get a dash pattern.                              */
const ROAD_STATE = {
  open:   { col: null,      dash: null },
  busy:   { col: '#fab219', dash: null },
  jam:    { col: '#ec835a', dash: null },
  threat: { col: '#d03b3b', dash: [9, 5] },
  closed: { col: '#7a2a2a', dash: [3, 5], alpha: 0.85 }
};

function drawRoads(t) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pass of [0, 1]) {
    for (const e of net.edges) {
      const st = roadState(e, t);
      const isAlert = st === 'closed' || st === 'jam' || st === 'threat';
      if ((pass === 0) === isAlert) continue;
      const cc = ROAD_CLASS[e.cls];
      const w = Math.max(1, cc.w * view.scale * 0.55);
      ctx.beginPath();
      for (let k = 0; k < e.cells.length; k++) {
        const c = e.cells[k], X = sx(c % N + 0.5), Y = sy(((c / N) | 0) + 0.5);
        k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
      // casing
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = w + 2; ctx.setLineDash([]);
      ctx.stroke();
      const sState = ROAD_STATE[st];
      ctx.strokeStyle = sState.col || cc.col;
      ctx.lineWidth = w;
      if (sState.dash) ctx.setLineDash(sState.dash.map(v => v * Math.max(0.6, view.scale * 0.4)));
      if (sState.alpha) ctx.globalAlpha = sState.alpha;
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  }
}

/* ----------------------------------------------------------------- routes */
let dashPhase = 0;
function drawRoutes(t) {
  const list = selectedComm >= 0 ? [evac.results[selectedComm]] : evac.results;
  for (const R of list) {
    if (!R || !R.route) continue;
    ctx.beginPath();
    for (const eid of R.route.edges) {
      const e = net.edges[eid];
      for (let k = 0; k < e.cells.length; k++) {
        const c = e.cells[k], X = sx(c % N + 0.5), Y = sy(((c / N) | 0) + 0.5);
        k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      }
    }
    ctx.strokeStyle = 'rgba(57,135,229,0.28)';
    ctx.lineWidth = Math.max(3, 5 * view.scale * 0.55);
    ctx.stroke();
    ctx.strokeStyle = '#7fb2f2';
    ctx.lineWidth = Math.max(1.4, 2.2 * view.scale * 0.55);
    ctx.setLineDash([7, 7]); ctx.lineDashOffset = -dashPhase;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // vehicles in transit
  ctx.fillStyle = '#cfe3ff';
  for (const R of list) {
    if (!R || !R.route) continue;
    const pts = [];
    for (const eid of R.route.edges) for (const c of net.edges[eid].cells) pts.push(c);
    if (pts.length < 2) continue;
    for (const leg of R.legs) {
      if (!leg.ok || leg.arrive === INF) continue;
      if (t < leg.depart || t > leg.arrive) continue;
      const f = (t - leg.depart) / Math.max(leg.arrive - leg.depart, 0.001);
      const c = pts[clamp(Math.floor(f * (pts.length - 1)), 0, pts.length - 1)];
      const X = sx(c % N + 0.5), Y = sy(((c / N) | 0) + 0.5);
      ctx.beginPath(); ctx.arc(X, Y, Math.max(2, 2.6 * view.zoom), 0, 7); ctx.fill();
    }
  }
}

/* ---------------------------------------------------------------- markers */
function tierColor(css) {
  return { critical: '#d03b3b', serious: '#ec835a', warning: '#fab219', good: '#0ca30c' }[css];
}
function drawMarkers(t) {
  // shelters
  for (const s of net.shelters) {
    const X = sx(s.x + 0.5), Y = sy(s.y + 0.5);
    const r = Math.max(6, 7 * view.zoom);
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
    ctx.fillStyle = 'rgba(12,163,12,0.22)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#0ca30c'; ctx.stroke();
    ctx.strokeStyle = '#eafbea'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(X - r * 0.42, Y); ctx.lineTo(X + r * 0.42, Y);
    ctx.moveTo(X, Y - r * 0.42); ctx.lineTo(X, Y + r * 0.42);
    ctx.stroke();
    if (layers.labels && view.zoom > 0.9) label(s.name, X, Y - r - 4, '#bfe6bf');
  }
  // communities
  evac.results.forEach((R, i) => {
    const c = net.comms[i];
    const X = sx(c.x + 0.5), Y = sy(c.y + 0.5);
    const rad = Math.max(5, (4 + Math.sqrt(c.pop) / 22) * view.zoom);
    const col = tierColor(R.tier.css);
    const threatened = c.fireT <= t;
    if (layers.zones) {
      ctx.beginPath(); ctx.arc(X, Y, rad * 2.5, 0, 7);
      ctx.fillStyle = col + '22'; ctx.fill();
      ctx.strokeStyle = col + '66'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.beginPath(); ctx.arc(X, Y, rad, 0, 7);
    ctx.fillStyle = threatened ? '#3a2422' : '#1c1c1b';
    ctx.fill();
    ctx.lineWidth = i === selectedComm ? 3 : 2;
    ctx.strokeStyle = i === selectedComm ? '#ffffff' : col;
    ctx.stroke();
    if (R.atRiskPop > 1) {
      ctx.beginPath(); ctx.arc(X, Y, rad + 4, 0, 7);
      ctx.strokeStyle = '#d03b3b'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
    }
    if (layers.labels && view.zoom > 0.75)
      label(c.name, X, Y - rad - 4, i === selectedComm ? '#ffffff' : '#e7e5dd');
  });
  // NASA FIRMS satellite thermal detections inside the current domain.
  // These are observations, not confirmed wildfire perimeters.
  if (typeof realHotspots !== 'undefined' && realHotspots.ready) {
    for (const h of realHotspots.hotspots) {
      if (!h.withinDomain) continue;
      const c = latLonToCell(h.lat, h.lon);
      const X = sx(c.x + 0.5), Y = sy(c.y + 0.5);
      const r = Math.max(3.5, 4.5 * view.zoom);
      ctx.save();
      ctx.beginPath(); ctx.arc(X, Y, r + 3, 0, 7);
      ctx.fillStyle = 'rgba(255,130,70,0.15)'; ctx.fill();
      ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
      ctx.fillStyle = '#ff8246'; ctx.fill();
      ctx.strokeStyle = '#ffe1c7'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
    }
  }

  // ignition points
  for (const ig of scenario.ignition) {
    const X = sx(ig.x + 0.5), Y = sy(ig.y + 0.5);
    ctx.save();
    ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X, Y, 7, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X - 10, Y); ctx.lineTo(X - 4, Y);
    ctx.moveTo(X + 4, Y); ctx.lineTo(X + 10, Y);
    ctx.moveTo(X, Y - 10); ctx.lineTo(X, Y - 4);
    ctx.moveTo(X, Y + 4); ctx.lineTo(X, Y + 10);
    ctx.stroke();
    ctx.restore();
  }
}
function label(text, X, Y, col) {
  ctx.font = '600 11px system-ui,-apple-system,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.72)';
  ctx.strokeText(text, X, Y);
  ctx.fillStyle = col; ctx.fillText(text, X, Y);
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
}

/* ------------------------------------------------------------ wind ribbon */
function drawWindHint() {
  const wRad = (scenario.windFrom + 180) * D2R;
  const ux = Math.sin(wRad), uy = -Math.cos(wRad);
  const cxp = view.w - 64, cyp = view.h - 54;
  ctx.save();
  ctx.translate(cxp, cyp);
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = '#c3c2b7'; ctx.fillStyle = '#c3c2b7'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-ux * 20, -uy * 20); ctx.lineTo(ux * 18, uy * 18); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ux * 24, uy * 24);
  ctx.lineTo(ux * 14 - uy * 6, uy * 14 + ux * 6);
  ctx.lineTo(ux * 14 + uy * 6, uy * 14 - ux * 6);
  ctx.closePath(); ctx.fill();
  ctx.font = '600 10px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(scenario.windSpeed.toFixed(0) + ' m/s', 0, 40);
  ctx.textAlign = 'start';
  ctx.restore();
}

/* ------------------------------------------------------------------ frame */
function draw() {
  fitView();
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.clearRect(0, 0, view.w, view.h);
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, view.w, view.h);

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const W = N * view.scale;
  ctx.drawImage(off.terrain, view.ox, view.oy, W, W);
  if (layers.fire) { paintFire(simT); ctx.drawImage(off.fire, view.ox, view.oy, W, W); }
  if (layers.iso) { ctx.globalAlpha = 0.85; ctx.drawImage(off.iso, view.ox, view.oy, W, W); ctx.globalAlpha = 1; }
  if (layers.smoke && layers.fire) drawSmoke(simT);

  // domain frame
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
  ctx.strokeRect(view.ox + 0.5, view.oy + 0.5, W, W);

  if (layers.roads) drawRoads(simT);
  if (layers.routes) drawRoutes(simT);
  drawMarkers(simT);
  drawWindHint();
}

  if (!isFinite(m)) return '—';

const authState={loading:true,authenticated:false,user:null};
let csrfToken='';
async function ensureCsrf(){
  if(csrfToken) return csrfToken;
  const r=await fetch('/api/security/csrf',{headers:{Accept:'application/json'}});
  const d=await r.json().catch(()=>({})); if(!r.ok||!d.token) throw new Error(d.error||'Could not initialize request security');
  csrfToken=d.token; return csrfToken;
}
async function writeFetch(url,opts={}){
  const token=await ensureCsrf();
  const headers={...(opts.headers||{}),'X-CSRF-Token':token};
  let r=await fetch(url,{...opts,headers});
  if(r.status===403){csrfToken='';const token2=await ensureCsrf();r=await fetch(url,{...opts,headers:{...(opts.headers||{}),'X-CSRF-Token':token2}});}
  return r;
}

/* ======================================================== wildfire feed */
/* Stage 6 uses NASA EONET's public event metadata feed. EONET is suitable for
   locating named/active wildfire incidents, but it is not the same thing as a
   per-pixel satellite hotspot feed. NASA FIRMS provides the latter and needs a
   MAP_KEY for web-service access; that belongs behind a backend in Stage 7. */
const realFires = {
  loading:false, ready:false, key:'', events:[], source:'NASA EONET',
  radiusKm:300, lastError:'', loadedAt:0
};
function invalidateRealFires(){ realFires.ready=false; realFires.key=''; realFires.events=[]; realFires.lastError=''; }
function fireFeedKey(){ return `${scenario.centerLat.toFixed(3)},${scenario.centerLon.toFixed(3)},${realFires.radiusKm}`; }
function haversineKm(aLat,aLon,bLat,bLon){
  const R=6371, p1=aLat*D2R, p2=bLat*D2R, dp=(bLat-aLat)*D2R, dl=(bLon-aLon)*D2R;
  const q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(q)));
}
function eonetFeaturePoint(f){
  const g=f&&f.geometry; if(!g) return null;
  const c=g.coordinates;
  if(g.type==='Point' && Array.isArray(c) && c.length>=2) return {lon:+c[0],lat:+c[1]};
  if(g.type==='MultiPoint' && Array.isArray(c) && c.length){ const z=c[c.length-1]; return {lon:+z[0],lat:+z[1]}; }
  if(g.type==='LineString' && Array.isArray(c) && c.length){ const z=c[c.length-1]; return {lon:+z[0],lat:+z[1]}; }
  if(g.type==='Polygon' && Array.isArray(c)&&c[0]&&c[0].length){ let lat=0,lon=0,n=0; for(const z of c[0]){ if(isFinite(z[0])&&isFinite(z[1])){lon+=+z[0];lat+=+z[1];n++;} } return n?{lat:lat/n,lon:lon/n}:null; }
  return null;
}
function eonetObservedAt(f){
  const p=f&&f.properties||{};
  return p.date||p.geometryDate||p.closed||'';
}
async function fetchWildfireIncidents(){
  realFires.loading=true; realFires.lastError='';
  try{
    const lat=scenario.centerLat, lon=scenario.centerLon, r=realFires.radiusKm;
    const dLat=r/111.32, dLon=r/Math.max(10,111.32*Math.cos(lat*D2R));
    const west=clamp(lon-dLon,-180,180), east=clamp(lon+dLon,-180,180), north=clamp(lat+dLat,-89.9,89.9), south=clamp(lat-dLat,-89.9,89.9);
    const bbox=`${west},${north},${east},${south}`;
    const q=new URLSearchParams({category:'wildfires',status:'open',days:'30',limit:'100',bbox});
    const r0=await fetch('/api/wildfires?'+q.toString(),{headers:{'Accept':'application/geo+json,application/json'}});
    if(!r0.ok) throw new Error('NASA EONET '+r0.status);
    const d=await r0.json();
    const ev=[];
    for(const f of (d.features||[])){
      const pt=eonetFeaturePoint(f); if(!pt||!isFinite(pt.lat)||!isFinite(pt.lon)) continue;
      const props=f.properties||{}, dist=haversineKm(lat,lon,pt.lat,pt.lon);
      ev.push({
        id:String(props.id||f.id||''), title:props.title||'Wildfire event', lat:pt.lat, lon:pt.lon,
        distanceKm:dist, observedAt:eonetObservedAt(f), link:props.link||'', source:props.sources||[],
        withinDomain:(()=>{const c=latLonToCell(pt.lat,pt.lon);return c.x>=0&&c.y>=0&&c.x<N&&c.y<N;})()
      });
    }
    ev.sort((a,b)=>a.distanceKm-b.distanceKm);
    realFires.events=ev; realFires.key=fireFeedKey(); realFires.ready=true; realFires.loadedAt=Date.now();
    return true;
  }catch(e){ realFires.ready=false; realFires.lastError=e.message||String(e); throw e; }
  finally{ realFires.loading=false; }
}
function useWildfireEvent(i, centerFirst=false){
  const e=realFires.events[i]; if(!e) return;
  if(centerFirst || !e.withinDomain){
    scenario.centerLat=e.lat; scenario.centerLon=e.lon; scenario.locationName=e.title;
    scenario.seed=seedFromGeo(e.lat,e.lon);
    scenario.ignitionSource=`NASA EONET incident: ${e.title}`; scenario.ignitionSourceUrl=e.link||''; scenario.ignitionObservedAt=e.observedAt||'';
    invalidateRealLandscape(); invalidateRealRoads(); invalidateRealPlaces(); invalidateLiveWeather(); invalidateRealFires(); invalidateRealHotspots();
    dirtyLandscape=true; buildLeft(); syncWind(); refreshRealData(true); return;
  }
  const p=latLonToCell(e.lat,e.lon), x=clamp(Math.round(p.x),0,N-1), y=clamp(Math.round(p.y),0,N-1);
  if(!FUELS[land.fuel[idx(x,y)]].burn){ alert('The reported incident point falls on a non-burnable cell in the current fuel proxy. Center the area on the incident or choose a nearby manual ignition.'); return; }
  scenario.ignition=[{x,y}]; scenario.ignitionSource=`NASA EONET incident: ${e.title}`; scenario.ignitionSourceUrl=e.link||''; scenario.ignitionObservedAt=e.observedAt||'';
  queue('fire'); buildLeft(); syncWind();
}
function wildfireStatusHtml(){
  if(realFires.loading) return '<b>Wildfire feed:</b> checking NASA EONET…';
  if(realFires.ready && realFires.key===fireFeedKey()) return `<b>NASA EONET:</b> ${realFires.events.length} open wildfire event${realFires.events.length===1?'':'s'} found within ${realFires.radiusKm} km in the last 30 days. <span style="color:var(--text-muted)">Event metadata, not satellite hotspot pixels.</span>`;

}

/* ================================================= NASA FIRMS hotspots */
const realHotspots={
  loading:false, ready:false, configured:null, key:'', hotspots:[], source:'VIIRS_NOAA20_NRT',
  days:2, radiusKm:35, lastError:'', loadedAt:0
};
function invalidateRealHotspots(){ realHotspots.ready=false; realHotspots.key=''; realHotspots.hotspots=[]; realHotspots.lastError=''; }
function hotspotFeedKey(){ return `${scenario.centerLat.toFixed(3)},${scenario.centerLon.toFixed(3)},${realHotspots.radiusKm},${realHotspots.source},${realHotspots.days}`; }
function hotspotBbox(){
  const lat=scenario.centerLat,lon=scenario.centerLon,r=realHotspots.radiusKm;
  const dLat=r/111.32,dLon=r/Math.max(10,111.32*Math.cos(lat*D2R));
  return [clamp(lon-dLon,-179.999,179.999),clamp(lat-dLat,-89.9,89.9),clamp(lon+dLon,-179.999,179.999),clamp(lat+dLat,-89.9,89.9)];
}
function firmsObservedAt(h){
  if(!h.acqDate)return ''; const t=String(h.acqTime||'').padStart(4,'0');
  return `${h.acqDate} ${t.slice(0,2)}:${t.slice(2,4)} UTC`;
}
async function fetchFirmsHotspots(){
  realHotspots.loading=true; realHotspots.lastError='';
  try{
    const st=await fetch('/api/firms/status',{headers:{Accept:'application/json'}}); const sj=await st.json();
    realHotspots.configured=!!sj.configured;
    if(!realHotspots.configured){ realHotspots.ready=false; realHotspots.hotspots=[]; realHotspots.key=hotspotFeedKey(); return false; }
    const q=new URLSearchParams({bbox:hotspotBbox().join(','),source:realHotspots.source,days:String(realHotspots.days)});
    const r=await fetch('/api/firms/hotspots?'+q.toString(),{headers:{Accept:'application/json'}});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||`NASA FIRMS ${r.status}`);
    const hs=(d.hotspots||[]).map((h,i)=>{
      const lat=+h.latitude,lon=+h.longitude,cell=latLonToCell(lat,lon);
      return {...h,id:`${h.satellite||'sat'}-${h.acqDate||''}-${h.acqTime||''}-${i}`,lat,lon,

        withinDomain:cell.x>=0&&cell.y>=0&&cell.x<N&&cell.y<N};
    }).filter(h=>isFinite(h.lat)&&isFinite(h.lon)).sort((a,b)=>a.distanceKm-b.distanceKm);
    realHotspots.hotspots=hs; realHotspots.ready=true; realHotspots.key=hotspotFeedKey(); realHotspots.loadedAt=Date.now();

  finally{ realHotspots.loading=false; }

function useFirmsHotspot(i,centerFirst=false){

function firmsStatusHtml(){

async function fetchLiveWeather(apply=true) {
  liveWeather.loading=true; liveWeather.lastError='';
  try {
    const q=new URLSearchParams({
      latitude:String(scenario.centerLat), longitude:String(scenario.centerLon),
      current:'temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      hourly:'temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
      wind_speed_unit:'ms', timezone:'auto', timeformat:'unixtime', forecast_days:'2'
    });
    const r=await fetch('/api/weather?latitude='+encodeURIComponent(scenario.centerLat)+'&longitude='+encodeURIComponent(scenario.centerLon),{headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('weather service '+r.status);

function slider(key, lbl, min, max, step, fmt, on, obj) {
  const host = obj || scenario;
  const f = el('div', 'field');
  const l = el('label', null, `<span>${lbl}</span><span class="val"></span>`);
  const i = el('input'); i.type = 'range'; i.min = min; i.max = max; i.step = step; i.value = host[key];
  const val = l.querySelector('.val');
  val.textContent = fmt(+i.value);
  i.oninput = () => { val.textContent = fmt(+i.value); on(+i.value); };
  f.appendChild(l); f.appendChild(i);
  f.dataset.key = key;
  f._set = v => { i.value = v; val.textContent = fmt(+v); };
  return f;
}
function toggleRow(lbl, get, set) {
  const r = el('label', 'tg');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = get();
  cb.onchange = () => set(cb.checked);
  r.appendChild(cb); r.appendChild(el('span', null, lbl));
  r._set = v => { cb.checked = v; };
  return r;
}

function dragDial(dial) {
  const set = ev => {
    const r = dial.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const pt = ev.touches ? ev.touches[0] : ev;
    let a = Math.atan2(pt.clientX - cx, -(pt.clientY - cy)) / D2R;
    if (a < 0) a += 360;
    scenario.windFrom = Math.round(a); liveWeather.manualOverride=true;
    syncWind(); queue('fire');
  };
  let down = false;
  dial.addEventListener('pointerdown', e => { down = true; dial.setPointerCapture(e.pointerId); set(e); });
  dial.addEventListener('pointermove', e => { if (down) set(e); });
  dial.addEventListener('pointerup', e => { down = false; try { dial.releasePointerCapture(e.pointerId); } catch (_) {} });
}
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function syncWind() {
  const n = $('#needle');
  if (n) n.style.transform = `rotate(${scenario.windFrom}deg)`;
  const ro = $('#windReadout');
  if (ro) ro.textContent = `${String(scenario.windFrom).padStart(3, '0')}° ${COMPASS[Math.round(scenario.windFrom / 22.5) % 16]}`;
}

function applyPreset(k, quiet) {
  const v = PRESETS[k];
  Object.assign(scenario, { windSpeed: v.windSpeed, windFrom: v.windFrom, moisture: v.moisture, rh: v.rh, temp: v.temp, spotting: v.spotting }); liveWeather.manualOverride=true;
  if (quiet) { buildLeft(); syncWind(); markPreset(k); return; }
  buildLeft(); syncWind(); markPreset(k); queue('scenario');
}

/* --------------------------------------------- corridor & shelter loading */
function renderLoads() {
  const host = $('#loadList');
  if (host) {
    /* Edges are just 300 m slices of longer corridors, so listing the top
       links by v/c returns the same road five times. Merge contiguous loaded
       slices that carry the same flow into one corridor first.            */
    const loaded = net.edges.filter(e => e.vol > 1);
    const seen = new Set(), groups = [];
    for (const e of loaded) {
      if (seen.has(e.id)) continue;
      const g = { cls: e.cls, vol: e.vol, cap: e.cap, len: 0, burns: false, ids: [] };
      const stack = [e];
      while (stack.length) {
        const cur = stack.pop();
        if (seen.has(cur.id)) continue;
        seen.add(cur.id);
        g.ids.push(cur.id); g.len += cur.len;
        g.vol = Math.max(g.vol, cur.vol);
        if (cur.fireT !== INF) g.burns = true;
        for (const nd of [cur.a, cur.b]) for (const link of net.adj[nd]) {
          const nx = net.edges[link.e];
          if (seen.has(nx.id) || nx.vol <= 1) continue;
          if (nx.cls !== cur.cls) continue;
          if (Math.abs(nx.vol - cur.vol) > Math.max(40, cur.vol * 0.12)) continue;
          stack.push(nx);
        }
      }
      groups.push(g);
    }
    groups.sort((a, b) => (b.vol / b.cap) - (a.vol / a.cap));
    const top = groups.slice(0, 5);
    host.innerHTML = top.length ? top.map(g => {
      const vc = g.vol / g.cap;
      const col = vc > 0.9 ? 'var(--serious)' : vc > 0.6 ? 'var(--warning)' : 'var(--good)';
      return `<div style="display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-muted);margin-bottom:5px">
        <span style="width:96px;color:var(--text-secondary)">${ROAD_CLASS[g.cls].name} · ${(g.len / 1000).toFixed(1)} km${g.burns ? ' <span style="color:var(--critical)" title="fire crosses this corridor">✕</span>' : ''}</span>
        <div style="flex:1;height:4px;border-radius:3px;background:var(--axis);overflow:hidden">
          <div style="height:100%;width:${clamp(vc * 100, 2, 100)}%;background:${col};border-radius:3px"></div></div>
        <span style="width:44px;text-align:right;font-family:var(--mono);color:${col}">${(vc * 100).toFixed(0)}%</span>
      </div>`;
    }).join('') + '<div class="note">✕ marks a corridor the fire crosses at some point in the run. ' +
      'Percentage is assigned departure flow against one-way capacity.</div>'
      : '<div class="note">No traffic assigned.</div>';
  }
  const sh = $('#shelterList');
  if (sh && evac.shelterLoad) {
    sh.innerHTML = net.shelters.map((s, i) => {
      const load = evac.shelterLoad[i] || 0;
      const f = load / s.cap;
      const col = f > 1 ? 'var(--critical)' : f > 0.85 ? 'var(--warning)' : 'var(--good)';
      return `<div style="display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-muted);margin-bottom:5px">
        <span style="width:110px;color:var(--text-secondary)" title="${esc(s.official?'Official emergency shelter tag':(s.capSource||'Planning site'))}">${esc(s.name.replace(' Shelter',''))}</span>
        <div style="flex:1;height:4px;border-radius:3px;background:var(--axis);overflow:hidden">
          <div style="height:100%;width:${clamp(f * 100, 2, 100)}%;background:${col};border-radius:3px"></div></div>
        <span style="width:62px;text-align:right;font-family:var(--mono);color:${col}">${fmtN(load)}</span>
      </div>`;
    }).join('');
  }
}

/* ---------------------------------------------------------------- charts */
function lineChart(id, series, opts) {
  const svg = document.getElementById(id);
  if (!svg) return;
  const W = 260, H = 92, PL = 30, PR = 6, PT = 8, PB = 16;
  const maxY = Math.max(opts.maxY || 0, ...series.map(v => v)) || 1;
  const n = series.length;
  const X = i => PL + (i / (n - 1)) * (W - PL - PR);
  const Y = v => H - PB - (v / maxY) * (H - PT - PB);
  let dLine = '', dArea = '';
  for (let i = 0; i < n; i++) {
    dLine += (i ? 'L' : 'M') + X(i).toFixed(2) + ' ' + Y(series[i]).toFixed(2) + ' ';
  }
  dArea = dLine + `L${X(n - 1).toFixed(2)} ${H - PB} L${X(0).toFixed(2)} ${H - PB} Z`;
  const gridY = [0, 0.5, 1].map(f => {
    const y = Y(maxY * f);
    return `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="var(--grid)" stroke-width="0.6"/>` +
      `<text x="${PL - 4}" y="${y + 3}" fill="var(--text-muted)" font-size="7" text-anchor="end">${opts.fmtY(maxY * f)}</text>`;
  }).join('');
  const ticks = [0, 6, 12, 18, 24].map(h => {
    const i = clamp(Math.round(h * 60 / opts.binMin), 0, n - 1);
    return `<text x="${X(i)}" y="${H - 4}" fill="var(--text-muted)" font-size="7" text-anchor="middle">${h}h</text>`;
  }).join('');
  const iNow = clamp(Math.round(simT / opts.binMin), 0, n - 1);
  const xNow = X(iNow), yNow = Y(series[iNow]);
  svg.innerHTML = `
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${opts.col}" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="${opts.col}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${gridY}
    <path d="${dArea}" fill="url(#${id}g)"/>
    <path d="${dLine}" fill="none" stroke="${opts.col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <line x1="${xNow}" y1="${PT}" x2="${xNow}" y2="${H - PB}" stroke="var(--text-muted)" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="${xNow}" cy="${yNow}" r="3.2" fill="${opts.col}" stroke="var(--surface-1)" stroke-width="1.6"/>
    <text x="${clamp(xNow + 5, PL, W - 40)}" y="${clamp(yNow - 5, 10, H - PB - 2)}" fill="var(--text-primary)" font-size="8" font-weight="600">${opts.fmtY(series[iNow])}</text>
    ${ticks}
    <line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="var(--axis)" stroke-width="0.8"/>`;
  // hover crosshair
  svg.onpointermove = ev => {
    const r = svg.getBoundingClientRect();
    const fx = (ev.clientX - r.left) / r.width * W;
    const i = clamp(Math.round((fx - PL) / (W - PL - PR) * (n - 1)), 0, n - 1);
    showTip(ev.clientX, ev.clientY, `<div class="t">${opts.title}</div>
      <div class="r"><span>time</span><b>${fmtHM(i * opts.binMin)}</b></div>
      <div class="r"><span>${opts.unit}</span><b>${opts.fmtY(series[i])}</b></div>`);
  };
  svg.onpointerleave = hideTip;
  // table view
  const tv = document.getElementById(id + 'tv');
  if (tv) {
    let rows = '';
    for (let h = 0; h <= 24; h++) {
      const i = clamp(Math.round(h * 60 / opts.binMin), 0, n - 1);
      rows += `<tr><td>${h}h</td><td style="text-align:right">${opts.fmtY(series[i])}</td></tr>`;

let geoMap = null, geoBox = null, geoMarker = null, geoCandidate = null;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function setGeoCandidate(lat, lon, name) {
  lat = clamp(+lat, -85, 85); lon = ((+lon + 540) % 360) - 180;

  const ro = $('#geoReadout'); if (ro) ro.textContent = `${geoCandidate.name} · ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  if (geoMap && window.L) {
    if (!geoMarker) geoMarker = L.marker([lat, lon]).addTo(geoMap); else geoMarker.setLatLng([lat, lon]);
    const half = DOMAIN_M / 2, dLat = half / 111320, dLon = half / Math.max(1000, metersPerDegLon(lat));
    const b = [[lat-dLat, lon-dLon],[lat+dLat, lon+dLon]];
    if (!geoBox) geoBox = L.rectangle(b, { color:'#ff9d2e', weight:2, fillOpacity:.08 }).addTo(geoMap); else geoBox.setBounds(b);
  }

function closeGeoPicker() { $('#geoModal').classList.remove('on'); $('#geoModal').setAttribute('aria-hidden','true'); }
function applyGeoCandidate(useAsIgnition=false) {
  if (!geoCandidate) return;
  if (useAsIgnition) {
    const p = latLonToCell(geoCandidate.lat, geoCandidate.lon);
    if (p.x < 0 || p.y < 0 || p.x >= N || p.y >= N) {
      alert('That ignition point is outside the current 7.68 km simulation area. Use this area first, then place the ignition.'); return;
    }
    const x=clamp(Math.round(p.x),0,N-1), y=clamp(Math.round(p.y),0,N-1);
    if (!FUELS[land.fuel[idx(x,y)]].burn) { alert('That cell is non-burnable in the current fuel layer. Choose a nearby point.'); return; }
    scenario.ignition=[{x,y}]; scenario.ignitionSource='Manual map-picker ignition'; scenario.ignitionSourceUrl=''; scenario.ignitionObservedAt=''; closeGeoPicker(); queue('fire'); return;
  }

  scenario.seed=seedFromGeo(scenario.centerLat, scenario.centerLon);
  invalidateRealLandscape(); invalidateRealRoads(); invalidateRealPlaces(); invalidateLiveWeather(); invalidateRealFires(); invalidateRealHotspots();
  // Keep the same relative ignition position while rebuilding the local domain.
  dirtyLandscape=true; closeGeoPicker(); buildLeft(); syncWind(); refreshRealData();
}

function updateLandscapeStatus(msg) {

async function refreshRealData(centeredOnIncident=false) {
  const busy=$('#busy'); if(busy) busy.classList.add('on'); updateLandscapeStatus('Loading geographic data and weather…');
  let landOK=false, roadsOK=false, placesOK=false, weatherOK=false, firesOK=false, hotspotsOK=false;
  try {
    try { await loadRealLandscape(m=>updateLandscapeStatus(m)); landOK=true; }
    catch(e) { console.warn('Real landscape load failed',e); realLandscape.ready=false; buildLandscape(scenario.seed); }

    buildNetwork(scenario.seed);
    try { await loadRealRoadNetwork(m=>updateLandscapeStatus(m)); roadsOK=true; }
    catch(e) { console.warn('Real road load failed',e); realRoads.lastError=e.message||String(e); }
    try { await loadRealCommunityData(m=>updateLandscapeStatus(m)); placesOK=true; }
    catch(e) { console.warn('Real community/site load failed',e); realPlaces.lastError=e.message||String(e); }
    try { updateLandscapeStatus('Loading live weather…'); await fetchLiveWeather(true); weatherOK=true; }
    catch(e) { console.warn('Live weather load failed',e); liveWeather.lastError=e.message||String(e); }
    try { updateLandscapeStatus('Loading nearby NASA wildfire incidents…'); await fetchWildfireIncidents(); firesOK=true; }
    catch(e) { console.warn('NASA wildfire feed load failed',e); realFires.lastError=e.message||String(e); }
    try { updateLandscapeStatus('Loading NASA FIRMS satellite hotspots…'); hotspotsOK=await fetchFirmsHotspots(); }
    catch(e) { console.warn('NASA FIRMS hotspot load failed',e); realHotspots.lastError=e.message||String(e); }

    dirtyLandscape=false; computeSpreadField(); if(!centeredOnIncident) placeDefaultIgnition(); else { const p=latLonToCell(scenario.centerLat,scenario.centerLon),x=clamp(Math.round(p.x),0,N-1),y=clamp(Math.round(p.y),0,N-1); scenario.ignition=[{x,y}]; } computeArrival(); stampFireTimes(); planEvacuation();
    paintTerrain(); paintIso(); buildLeft(); syncWind(); fullUpdate(); updateLandscapeStatus();
    if(!landOK||!roadsOK||!placesOK||!weatherOK||!firesOK) {
      const miss=[!landOK?'terrain/land-cover':null,!roadsOK?'roads':null,!placesOK?'communities/evacuation sites':null,!weatherOK?'weather':null,!firesOK?'wildfire incidents':null].filter(Boolean).join(', ');
      alert(`Some real-world data (${miss}) could not be loaded, so Ember kept a fallback for that layer. The rest of the scenario is still usable.`);

}

async function searchLocation(q) {
  q=(q||'').trim(); if (!q) return;
  // Accept direct "lat, lon" input without an API call.
  const m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if (m) { openGeoPicker(+m[1], +m[2], 'Coordinates'); return; }
  try {
    const url='/api/geocode?q='+encodeURIComponent(q);
    const r=await fetch(url, { headers:{'Accept':'application/json'} });
    if(!r.ok) throw new Error('geocoder '+r.status);
    const a=await r.json(); if(!a.length) { alert('Location not found. Try a city plus state/country, or enter latitude, longitude.'); return; }
    openGeoPicker(+a[0].lat,+a[0].lon,a[0].display_name||q);
  } catch(e) { alert('Location search is unavailable right now. You can enter coordinates directly, for example 26.4499, 80.3319.'); }
}

/* ---------------------------------------------------------- map controls */
function wireMap() {
  let dragging = false, moved = 0, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointerup', e => {
    dragging = false;
    try { cv.releasePointerCapture(e.pointerId); } catch (_) {}
    if (moved > 4) return;
    const r = cv.getBoundingClientRect();
    const p = inv(e.clientX - r.left, e.clientY - r.top);
    if (igniteArmed) {
      const x = clamp(Math.round(p.x), 0, N - 1), y = clamp(Math.round(p.y), 0, N - 1);
      if (FUELS[land.fuel[idx(x, y)]].burn) {
        scenario.ignition = [{ x, y }];
        scenario.ignitionSource='Manual simulation-map ignition'; scenario.ignitionSourceUrl=''; scenario.ignitionObservedAt='';
        igniteArmed = false; buildLeft(); syncWind();
        queue('fire');
      }
      return;
    }
    // select nearest community
    let best = -1, bd = 9;
    net.comms.forEach((c, i) => { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; best = i; } });
    selectedComm = best;
    renderZones(); draw();
  });
  cv.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.clientX - lx, dy = e.clientY - ly;
      moved += Math.abs(dx) + Math.abs(dy);
      view.panX += dx; view.panY += dy; lx = e.clientX; ly = e.clientY;
      draw(); return;
    }
    const r = cv.getBoundingClientRect();
    const p = inv(e.clientX - r.left, e.clientY - r.top);
    const x = Math.round(p.x), y = Math.round(p.y);
    if (x < 0 || y < 0 || x >= N || y >= N) { hideTip(); return; }
    hoverCell = idx(x, y);
    showTip(e.clientX, e.clientY, cellTip(hoverCell, p));
  });
  cv.addEventListener('pointerleave', hideTip);
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const before = inv(px, py);
    view.zoom = clamp(view.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 1, 8);
    fitView();
    const after = inv(px, py);
    view.panX += (after.x - before.x) * view.scale;
    view.panY += (after.y - before.y) * view.scale;
    draw();
  }, { passive: false });
}

function cellTip(i, p) {
  const f = FUELS[land.fuel[i]];
  const a = fire.arrival[i];
  const flame = 0.0775 * Math.pow(Math.max(fire.fli[i], 0), 0.46);
  let extra = '';
  let bestC = null, bd = 6;
  net.comms.forEach((c, k) => { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; bestC = k; } });
  if (bestC !== null) {
    const R = evac.results[bestC];
    extra = `<div class="r" style="margin-top:4px"><span>${R.name}</span><b>${fmtN(R.pop)}</b></div>
             <div class="r"><span>zone</span><b style="color:${tierColor(R.tier.css)}">${R.tier.label}</b></div>
             <div class="r"><span>clearance</span><b>${R.clearance >= 0 ? fmtDur(R.clearance) : 'no route'}</b></div>`;
  }
  const g = cellToLatLon(p.x, p.y);
  return `<div class="t">${f.name}</div>
    <div class="r"><span>coordinate</span><b>${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}</b></div>
    <div class="r"><span>elevation</span><b>${Math.round(land.elev[i])} m</b></div>
    <div class="r"><span>slope</span><b>${(Math.atan(land.slope[i]) / D2R).toFixed(0)}°</b></div>
    <div class="r"><span>head ROS</span><b>${fire.rHead[i] > 0 ? fire.rHead[i].toFixed(1) + ' m/min' : '—'}</b></div>
    <div class="r"><span>flame length</span><b>${fire.rHead[i] > 0 ? flame.toFixed(1) + ' m' : '—'}</b></div>
    <div class="r"><span>fire arrives</span><b>${a === INF ? 'not in 24 h' : fmtDur(a)}</b></div>${extra}`;
}

/* ------------------------------------------------------- compute pipeline */
let pending = null, busyTimer = null;
function queue(kind) {
  if (pending) clearTimeout(pending);
  document.getElementById('busy').classList.add('on');
  pending = setTimeout(() => {
    pending = null;
    const t0 = performance.now();
    if (kind === 'all') { recompute({ landscape: true }); paintTerrain(); }
    else if (kind === 'scenario') { recompute({ reIgnite: true }); }
    else if (kind === 'fire') { recompute({}); }
    else { planEvacuation(); }
    paintIso();
    fullUpdate();
    document.getElementById('busy').classList.remove('on');
    const ms = performance.now() - t0;
    const sn = $('#seedNote');
    if (sn) sn.innerHTML = `<b>${esc(scenario.locationName)}</b> · ${scenario.centerLat.toFixed(4)}, ${scenario.centerLon.toFixed(4)}<br>seed <code>${scenario.seed}</code> · ${net.comms.length} communities · ` +
      `${net.edges.length} road links · solved in ${ms.toFixed(0)} ms`;
  }, 30);
}

function fullUpdate() {
  renderZones(); renderLoads(); renderCharts(); renderRiskTrack(); renderLegend();
  frameUpdate();
  const d = $('#dangerNote');
  if (d) {
    // the single hottest cell on a 57 600-cell map is an outlier; report the
    // 99th percentile of burnable ground, which is what crews would actually see
    const burnable = Array.from(fire.rHead).filter(v => v > 0).sort((a, b) => a - b);
    const pct = f => burnable.length ? burnable[Math.floor(f * (burnable.length - 1))] : 0;
    const maxR = pct(0.99);
    const fliS = Array.from(fire.fli).filter(v => v > 0).sort((a, b) => a - b);
    const fl = 0.0775 * Math.pow(fliS.length ? fliS[Math.floor(0.99 * (fliS.length - 1))] : 0, 0.46);
    const sev = maxR > 60 ? ['EXTREME', 'var(--critical)'] : maxR > 25 ? ['VERY HIGH', 'var(--serious)']
      : maxR > 10 ? ['HIGH', 'var(--warning)'] : ['MODERATE', 'var(--good)'];
    d.innerHTML = `Head fire (99th pct): <b style="color:${sev[1]}">${maxR.toFixed(0)} m/min</b> · ` +
      `flame length up to <b>${fl.toFixed(1)} m</b> · danger <b style="color:${sev[1]}">${sev[0]}</b>. ` +
      (fl > 3.5 ? 'Direct attack by hand crews is not possible.' : 'Direct attack may still be feasible.');
  }
}
function frameUpdate() {
  renderTiles();
  $('#clockBig').textContent = fmtHM(simT);
  $('#tSlider').value = simT;
  draw();
  renderScale();
  // keep the "now" marker on the charts live without rebuilding tables
  renderCharts();
}

/* ------------------------------------------------------------------ loop */
function tick(ts) {
  const dt = lastFrame ? (ts - lastFrame) / 1000 : 0;
  lastFrame = ts;
  dashPhase = (dashPhase + dt * 26) % 14;
  if (playing) {
    simT += dt * speed;
    if (simT >= HORIZON) { simT = HORIZON; playing = false; setPlayIcon(); }
    frameUpdate();
  } else if (layers.routes) {
    draw();
  }
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ boot */
function boot() {
  applyPreset('summer', true);
  buildLeft();
  buildRight();
  buildTimeline();
  wireMap();
  wireGeoPicker();
  syncWind();
  markPreset('summer');
  dirtyLandscape = true;
  recompute({ landscape: true });
  paintTerrain(); paintIso();
  simT = 210;
  fullUpdate();
  setPlayIcon();
  const sn = $('#seedNote');
  if (sn) sn.innerHTML = `<b>${esc(scenario.locationName)}</b> · ${scenario.centerLat.toFixed(4)}, ${scenario.centerLon.toFixed(4)}<br>seed <code>${scenario.seed}</code> · ${net.comms.length} communities · ${net.edges.length} road links`;
  requestAnimationFrame(tick);
  // Stage 9: restore the server-side session and external context once at startup.
  refreshAuth().then(()=>buildLeft());
  Promise.allSettled([fetchLiveWeather(false), fetchWildfireIncidents(), fetchFirmsHotspots()]).then(()=>{ buildLeft(); syncWind(); updateLandscapeStatus(); });
}
window.addEventListener('resize', () => { fitView(); draw(); renderScale(); });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; setPlayIcon(); }
  if (e.code === 'ArrowRight') { simT = clamp(simT + (e.shiftKey ? 60 : 10), 0, HORIZON); playing = false; setPlayIcon(); frameUpdate(); }
  if (e.code === 'ArrowLeft') { simT = clamp(simT - (e.shiftKey ? 60 : 10), 0, HORIZON); playing = false; setPlayIcon(); frameUpdate(); }
});
boot();
</script>
</body>
</html>
